name: release

# On a version tag, publish the vc-cxx-cost image that `cxx-cost/action.yml`
# (and the docs) refer to.
on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: cxx-runtime
          push: true
          tags: ghcr.io/${{ github.repository }}/cxx-cost:${{ github.ref_name }}
          cache-from: type=gha,scope=cxx
