name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: test
          load: true
          tags: virtuous-cycles:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
      - run: docker run --rm --tmpfs /tmp -e PYTEST_XDIST_AUTO_NUM_WORKERS=2 virtuous-cycles:test
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: virtuous-cycles:latest
          cache-from: type=gha,scope=test
      - run: docker run --rm virtuous-cycles:latest --help
      - run: docker run --rm --entrypoint vc-py-cost virtuous-cycles:latest --help

  infer-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: tests/infer
          target: check
          cache-from: type=gha,scope=infer
          cache-to: type=gha,mode=max,scope=infer

  cxx-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: cxx-test
          load: true
          tags: vc-cxx-cost:test
          cache-from: type=gha,scope=cxx
          cache-to: type=gha,mode=max,scope=cxx
      - run: docker run --rm vc-cxx-cost:test
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: cxx-runtime
          load: true
          tags: vc-cxx-cost:latest
          cache-from: type=gha,scope=cxx
      - run: docker run --rm vc-cxx-cost:latest --help
