version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /
      - /tests/infer
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "ubuntu"
        # non-LTS releases (LTS = even year, .04)
        versions: [">= 24.05, < 26.04", "> 26.04, < 28.04"]
